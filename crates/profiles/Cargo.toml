[package]
name = "zenytt-profiles"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Profils de serveurs, secrets (keyring) et journal d'actions, partagés par l'app et le serveur MCP"

[dependencies]
zenytt-core.workspace = true
serde.workspace = true
serde_json.workspace = true
keyring = { version = "4.2.0", optional = true }
dirs = "6"
ring = "0.17"
base64 = "0.23"
ureq = { version = "3.4", features = ["json"] }

[features]
# Coffre de l'OS. L'app mobile le désactive (pas de keyring sur Android) et appelle `secrets::use_file`.
default = ["keyring"]
keyring = ["dep:keyring"]

[dev-dependencies]
tempfile = "3"
