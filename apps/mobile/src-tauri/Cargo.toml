[package]
name = "zenytt-mobile"
description = "Zenytt Compagnon — consultation et gestes rapides sur Android et iOS"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# Le suffixe `_lib` évite un conflit de nom avec le binaire sous Windows (cargo#8519).
name = "zenytt_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Seuls les modules qui existent sur mobile (pas de mise à jour, de zone de notification ni de raccourcis globaux).
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
zenytt-core.workspace = true
zenytt-protocol.workspace = true
# Sans keyring (absent d'Android) : les secrets vont dans un fichier privé de l'app.
zenytt-profiles = { path = "../../../crates/profiles", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
base64 = "0.23.1"
uuid = { version = "1.26.1", features = ["v4"] }
