[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri", "apps/mobile/src-tauri", "crates/*"]

[workspace.package]
version = "1.3.3"
edition = "2021"
license = "LicenseRef-PolyForm-Shield-1.0.0"

[workspace.dependencies]
zenytt-ai = { path = "crates/ai" }
zenytt-core = { path = "crates/core" }
zenytt-protocol = { path = "crates/protocol" }
zenytt-profiles = { path = "crates/profiles" }
zenytt-mcp = { path = "crates/mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
