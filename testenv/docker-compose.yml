# Faux VPS de test, ISOLÉ : il a son propre démon Docker (Docker-in-Docker) et ne voit jamais
# les conteneurs de ta machine. Tout peut y être cassé sans risque.
#
#   pnpm testenv                      (ou : docker compose -f testenv/docker-compose.yml up -d --build)
#   SSH : 127.0.0.1:2222   root / zenytt   ou   deploy / deploy (sudo avec mot de passe)
#   Second VPS « Debian réaliste » : 127.0.0.1:2223   admin / admin (sudo avec mot de passe, fail2ban actif)
#   Hôte de VM (libvirt) : 127.0.0.1:2224   root / zenytt, kvm / kvm (groupe libvirt), nokvm / nokvm
#   Réseau privé : 127.0.0.1:2225 (mesh-a) et 127.0.0.1:2226 (mesh-b), root / zenytt ou deploy / deploy
#   SFTP seul : 127.0.0.1:2227  sftp / sftp (dossier upload) ; FTP : 127.0.0.1:2121  ftp / ftp
#   Débannir le PC après des tests fail2ban :  docker exec zenytt-test-debian fail2ban-client unban --all
#   Tout supprimer :  docker compose -f testenv/docker-compose.yml down -v
services:
  # Démon Docker privé du faux VPS. Le VPS partage son réseau : 127.0.0.1 est le même pour les
  # deux, comme sur un vrai serveur où nginx joint les conteneurs sur 127.0.0.1:PORT.
  dind:
    image: docker:27-dind
    container_name: zenytt-test-dind
    hostname: test-vps
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - dind-run:/var/run
      - dind-data:/var/lib/docker
    ports:
      - "127.0.0.1:2222:22"

  vps:
    build: .
    container_name: zenytt-test-vps
    network_mode: "service:dind"
    volumes:
      - dind-run:/var/run/dind
    depends_on:
      - dind

  # Debian non-root, port 6666, fail2ban : voir debian/Dockerfile.
  debian:
    build: ./debian
    container_name: zenytt-test-debian
    hostname: debian-vps
    cap_add:
      - NET_ADMIN
    ports:
      - "127.0.0.1:2223:6666"

  # Deux membres d'un réseau privé WireGuard (section Réseau privé) : voir mesh/Dockerfile.
  mesh-a:
    build: ./mesh
    container_name: zenytt-test-mesh-a
    hostname: mesh-a
    cap_add: [NET_ADMIN]
    networks: [default, meshnet]
    ports:
      - "127.0.0.1:2225:22"

  mesh-b:
    build: ./mesh
    container_name: zenytt-test-mesh-b
    hostname: mesh-b
    cap_add: [NET_ADMIN]
    networks: [default, meshnet]
    ports:
      - "127.0.0.1:2226:22"

  # Hôte de VM : libvirt + QEMU en émulation, deux VM (VNC et SPICE). Voir libvirt/Dockerfile.
  libvirt:
    build: ./libvirt
    container_name: zenytt-test-libvirt
    # libvirt a besoin des cgroups et de créer des interfaces réseau.
    privileged: true
    ports:
      - "127.0.0.1:2224:22"

  # Comptes « fichiers seulement » : SFTP sans shell (chroot) et FTP, voir les profils SFTP seul / FTP.
  sftp:
    image: atmoz/sftp
    container_name: zenytt-test-sftp
    command: sftp:sftp:::upload
    ports:
      - "127.0.0.1:2227:22"

  ftp:
    image: delfer/alpine-ftp-server
    container_name: zenytt-test-ftp
    environment:
      USERS: "ftp|ftp"
      MIN_PORT: "21100"
      MAX_PORT: "21110"
    ports:
      - "127.0.0.1:2121:21"
      - "127.0.0.1:21100-21110:21100-21110"

volumes:
  dind-run:
  dind-data:

networks:
  meshnet:
